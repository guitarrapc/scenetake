# The prompt's {dir} follows the folder that each step starts in: pre's cd, a step's cd, and a show: none step's cd
# (spec_scenario.md → settings, Prompt). Run from the repository root by tests/shell_state_test.cs.
title: "prompt folder (bash)"
width: 60
height: 12
shell: bash
settings:
  typing-speed: 0.001
  typing-jitter: 0
  pre-delay: 0
  post-delay: 0
  prompt:
    - text: "{dir}"
      color: "fg:blue"
    - " $ "
pre:
  - cd tests
steps:
  - echo first
  - cd fixtures
  - echo second
  - run: cd ..
    show: none
  - echo third
