# settings.shell-prompt draws zsh's own prompt once the scenario sets one (spec_scenario.md → Prompt). The first step
# shows settings.prompt. A PS1 set in a show: none step, $? of the last command, and the folder then show in the next
# prompt. prompt_subst carries to the next shell, where the prompt is drawn again, and precmd runs before each prompt.
# Run from the repository root by ShellStateTests.
title: "shell prompt (zsh)"
width: 60
height: 12
shell: zsh
settings:
  typing-speed: 0.001
  typing-jitter: 0
  pre-delay: 0
  post-delay: 0
  end-prompt: true
  shell-prompt: true
  prompt: "tpl $ "
pre:
  - cd tests
steps:
  - echo first
  - run: PS1='%F{green}%1~%f [%?] > '
    show: none
  - echo second
  - run: cd fixtures && false
    continue-on-error: true
  - echo third
  - run: setopt prompt_subst; branch() { print -n main }; PS1='%1~ ($(branch)) > '
    show: none
  - echo fourth
  - echo fifth
  - run: precmd() { PS1="st=$? > " }; exit 3
    continue-on-error: true
  - echo sixth
