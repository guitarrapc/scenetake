title: instant progress bar
shell: bash

settings:
  prompt: "$ "
  typing-speed: 0.01
  typing-jitter: 0
  pre-delay: 0
  post-delay: 0
  execution-duration: 0.1

steps:
  - name: carriage-return progress (agg-like)
    run: bash -c 'for i in $(seq 1 30); do printf "\rSCENETAKE_PROGRESS %d/30" "$i"; sleep 0.01; done; printf "\n"'
