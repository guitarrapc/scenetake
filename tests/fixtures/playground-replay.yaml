# The playground replays what the CLI recorded. PlaygroundReplayTests records this scenario with
# SCENETAKE_OUTPUTS, replays the outputs file, and checks that the cast and SVG are the CLI's, byte for byte.
# The steps cover instant and streamed pipe output, stderr, highlights, an OSC title in pipe and PTY output
# (masked in the outputs file), and a repeated command.
title: "Playground replay"
width: 60
height: 12
shell: bash

settings:
  typing-speed: 0.01
  typing-jitter: 0.005
  pre-delay: 0.1
  post-delay: 0.1

steps:
  - echo "hello"
  - name: stderr and stdout
    run: echo err 1>&2; echo out
  - name: highlight
    run: printf 'alpha beta\ngamma delta\n'
    highlight:
      - color: green
        at: "2:7-"
  - name: streamed
    run: for i in 1 2 3; do echo "line $i"; sleep 0.1; done
    stream-output: true
  - name: title in pipe output
    run: printf '\033]0;secret-pipe-title\007visible\n'
  - name: title and folder in pty output
    run: printf '\033]0;secret-pty-title\007pty out\r\n'; printf '\033]7;file:///home/secret-folder\033\\done\r\n'
    pty: true
  - echo "hello"
