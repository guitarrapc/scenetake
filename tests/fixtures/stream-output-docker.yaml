title: stream output docker build
shell: bash

settings:
  prompt: "$ "
  typing-speed: 0.01
  typing-jitter: 0
  pre-delay: 0
  post-delay: 0
  execution-duration: 0.05

steps:
  - name: docker build stream
    run: |
      dockerdir="$(pwd)/.scenetake-docker-$RANDOM-$$"
      dockerfile="$dockerdir/Dockerfile"
      mkdir -p "$dockerdir"
      trap 'rm -rf "$dockerdir"' EXIT
      cat >"$dockerfile" <<'EOF'
      FROM alpine:3.20
      RUN echo "scenetake-layer-1"
      RUN sleep 2
      RUN echo "scenetake-layer-2"
      EOF
      docker build --no-cache --progress=plain -f "$dockerfile" "$dockerdir"
    stream-output: true
    max-duration: 12
    silence-threshold: 2.0
    max-idle: 0.2
