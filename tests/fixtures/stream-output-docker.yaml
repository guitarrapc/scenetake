title: stream output docker build
shell: bash

settings:
  prompt: "$ "
  typing-speed: 0.01
  typing-jitter: 0
  pre-delay: 0
  post-delay: 0
  execution-duration: 0.05

steps:
  - name: docker stream
    run: |
      echo "scenetake-layer-1"
      docker version --format '{{.Server.Version}}'
      sleep 2
      echo "scenetake-layer-2"
      docker version --format '{{.Server.Version}}'
    stream-output: true
    max-duration: 12
    silence-threshold: 2.0
    max-idle: 0.2
