# Password prompt demo — type a sudo password in an interactive step and keep it out of the recording.
# Linux / macOS only. Run manually from a real terminal (not CI), with an account that may use sudo:
#
#   scenetake --format svg samples/password-prompt.yaml out/password-prompt
#
# sudo -k forgets cached credentials, so it asks for the password on every run. sudo turns terminal echo
# off while you type it, so the password never reaches the PTY output, and the cast holds only PTY output.
# Keys typed at a password prompt are also left out of scenetake's input log, so normalize-typing still
# re-times the name typed after it.
# The reference .cast / .svg / .gif were recorded in a disposable container as a throwaway user `demo`.

title: "Password Prompt Demo"
width: 80
height: 12
shell: bash

settings:
  prompt: "$ "
  typing-speed: 0.05
  pre-delay: 0.4
  post-delay: 1.0

steps:
  - name: "sudo asks for a password, which never reaches the recording"
    run: |-
      sudo -k whoami && read -p "Your name: " name && echo "Hello, $name!"
    pty: true
    interactive: true
    normalize-typing: true # banner and prompts at real speed; the typed name at typing-speed

  - echo "continued after the interactive step"
