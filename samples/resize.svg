<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="829.6" height="264" viewBox="0 0 829.6 264" preserveAspectRatio="xMidYMid meet" role="img" aria-label="scenetake output">
<style>
text { font-family: ui-monospace, "Cascadia Mono", "Cascadia Code", "JetBrains Mono", "Noto Sans Mono", SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-size: 16px; white-space: pre; }
text { dominant-baseline: alphabetic; }
.bg,rect:not([class]) { shape-rendering: crispEdges; }
.l { opacity: 0; animation: 1.6s step-end infinite; }
.c { fill: #d0d0d0; fill-opacity: 0.5; }
@keyframes k0{0%{opacity:1}}
.k0{animation-name:k0}
@keyframes k1{37.5%{opacity:1}}
.k1{animation-name:k1}
@keyframes k2{68.75%{opacity:1}}
.k2{animation-name:k2}
@keyframes k3{0%{opacity:1}37.5%{opacity:0}}
.k3{animation-name:k3}
@keyframes k4{37.5%{opacity:1}68.75%{opacity:0}}
.k4{animation-name:k4}
</style>
<defs>
<mask id="viewport-mask" x="0" y="0" width="829.6" height="264" maskUnits="userSpaceOnUse">
<rect class="l k3 viewport-mask-0" x="8" y="8" width="416.8" height="168" fill="white"/>
<rect class="l k4 viewport-mask-1" x="8" y="8" width="813.6" height="248" fill="white"/>
<rect class="l k2 viewport-mask-2" x="8" y="8" width="516" height="128" fill="white"/>
</mask>
</defs>
<g mask="url(#viewport-mask)">
<rect class="bg l k3 viewport-bg-0" x="8" y="8" width="416.8" height="168" fill="#282c34"/>
<rect class="bg l k4 viewport-bg-1" x="8" y="8" width="813.6" height="248" fill="#282c34"/>
<rect class="bg l k2 viewport-bg-2" x="8" y="8" width="516" height="128" fill="#282c34"/>
<g class="l k0"><text x="18" y="24.8" fill="#d0d0d0" textLength="208.32">Small terminal (40x8)</text></g>
<g class="l k1"><text x="18" y="44.8" fill="#d0d0d0" textLength="168.64">Expanded to 80x12</text></g>
<g class="l k2"><text x="18" y="64.8" fill="#d0d0d0" textLength="138.88">Shrunk to 50x6</text></g>
<rect class="l k3 c" x="18" y="32" width="9.92" height="20"/>
<rect class="l k4 c" x="18" y="52" width="9.92" height="20"/>
<rect class="l k2 c" x="18" y="72" width="9.92" height="20"/>
