# yaml-language-server: $schema=https://raw.githubusercontent.com/guitarrapc/scenetake/v1.5.0/schema/scenario.schema.json
title: "Git Workflow Demo"
width: 80
height: 30
shell: bash

# Working directory for all steps (optional)
# cwd: /path/to/repo

steps:
  - git --version

  # Show current status - linger a bit longer so viewers can read it
  - run: git status
    post-delay: 1.5

  - run: git log --oneline -5
    post-delay: 1.5

  # Fast command, shorter pause after
  - run: git branch
    post-delay: 0.5

  # Slower typing to emphasise the command
  - run: git diff --stat HEAD~1
    typing-speed: 0.10
    post-delay: 1.5
