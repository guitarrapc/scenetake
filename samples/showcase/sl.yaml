# yaml-language-server: $schema=https://raw.githubusercontent.com/guitarrapc/scenetake/v1.5.0/schema/scenario.schema.json
title: "sl"
width: 80
height: 16
shell: bash

settings:
  pre-delay: 0
  post-delay: 0

render:
  window: macos
  end-hold: 0               # start again as soon as the train has passed

steps:
  # sl draws a train across the alternate screen with curses, and returns when it has passed. Only its output shows,
  # with no prompt and no typing, so the SVG loops the train alone.
  - run: sl
    pty: true
    show: output
