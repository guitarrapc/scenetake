# yaml-language-server: $schema=https://raw.githubusercontent.com/guitarrapc/scenetake/v1.5.0/schema/scenario.schema.json
title: "Secrets stay out"
width: 80
height: 12
shell: bash

settings:
  prompt: "$ "
  typing-speed: 0.04
  pre-delay: 0.6
  post-delay: 1.8
  mask:
    - "build.internal.example"   # a host name to keep out, besides what scenetake finds by itself

render:
  window: macos

# A dummy token and password, put together here so that no file in the repository holds a whole token. The token has
# the shape of GitHub's, "ghp_" and 36 letters and digits, and says it is a dummy. The recording shows neither.
pre:
  - printf 'GITHUB_TOKEN=ghp_%s%s\nAPI_URL=https://deploy:%s@build.internal.example/v1\n' DUMMYTOKENFORSCENETAKE DEMO0123456789 not-a-real-password > .env

steps:
  - name: "[bright-cyan]A .env file with a token, a password, and an internal host"
    run: cat .env
  - name: "[bright-cyan]The token, read from the environment"
    run: source .env && echo "$GITHUB_TOKEN"
  - name: "[bright-cyan]A header that carries it"
    run: 'echo "Authorization: Bearer $GITHUB_TOKEN"'

post:
  - rm -f .env
