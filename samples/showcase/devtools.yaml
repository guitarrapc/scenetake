# yaml-language-server: $schema=https://raw.githubusercontent.com/guitarrapc/scenetake/v1.5.0/schema/scenario.schema.json
title: "Developer tools"
width: 80
height: 26
shell: bash

settings:
  prompt: "$ "
  typing-speed: 0.03
  pre-delay: 0.6
  post-delay: 2.0

render:
  window: windows

# The commands run in the small project that the showcase image holds (Dockerfile, app/). In a PTY these tools see a
# terminal, so they color their output and draw bat's grid by themselves.
steps:
  - run: bat --paging=never greet.py
    pty: true
  - run: git log --graph --oneline --all
    pty: true
  - run: jq .scripts package.json
    pty: true
