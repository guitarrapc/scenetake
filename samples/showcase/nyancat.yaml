# yaml-language-server: $schema=https://raw.githubusercontent.com/guitarrapc/scenetake/v1.5.0/schema/scenario.schema.json
title: "nyancat"
width: 96
height: 26
shell: bash

settings:
  prompt: "$ "
  typing-speed: 0.05
  pre-delay: 0.6
  post-delay: 1.0

steps:
  # nyancat runs until it is stopped. timeout presses Ctrl+C after 5 seconds, as a person would. -n and -s leave
  # out the timer and the window title.
  - run: nyancat -n -s
    pty: true
    timeout: 5
