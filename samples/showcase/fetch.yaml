# yaml-language-server: $schema=https://raw.githubusercontent.com/guitarrapc/scenetake/v1.5.0/schema/scenario.schema.json
title: "fastfetch"
width: 76
height: 20
shell: bash

settings:
  prompt: "$ "
  typing-speed: 0.03
  pre-delay: 0.6
  post-delay: 3.0

render:
  window: macos                       # the title bar shows the title above
  background: "#0f2027 #203a43 #2c5364" # a gradient behind the window

steps:
  # fastfetch prints colors only to a terminal, so it runs in a PTY. Its modules are in fastfetch.jsonc.
  - run: fastfetch
    pty: true
