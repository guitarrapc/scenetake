# Interactive PTY demo — run manually from a real terminal (not CI).
# Requires: host stdin/stdout TTY, and the command installed (vim, copilot, etc.).
#
#   scenetake --format svg samples/interactive-pty.yaml out/interactive-pty
#
# The step records wall-clock PTY output while you operate the TUI on the host.
# Pre-generated .cast / .svg are intentionally omitted.

title: "Interactive PTY Demo"
width: 80
height: 24

settings:
  prompt: "$ "
  typing-speed: 0.05
  pre-delay: 0.4
  post-delay: 1.0

steps:
  - name: "edit in vim"
    run: vim README.md
    pty: true
    interactive: true

  - name: "Copilot CLI with banner"
    run: copilot --banner
    pty: true
    interactive: true

  - echo "continued after interactive step"
