name: Deploy Playground

# Builds the browser playground (.github/docs/spec_playground.md) from a release tag and deploys it to GitHub Pages.
# The site's samples and outputs files come from the same tag as its code.

concurrency:
  group: pages
  cancel-in-progress: false

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Existing Git tag to deploy (e.g. v1.6.0 or 1.6.0). Must already exist on the remote."
        required: true
        type: string

permissions: {}

jobs:
  build:
    name: Build playground
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Normalize tag (workflow_dispatch)
        id: tag
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          RAW: ${{ github.event.inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          V="${RAW#v}"
          if [ -z "$V" ]; then
            echo "::error::version input must not be empty."
            exit 1
          fi
          echo "ref=v${V}" >> "$GITHUB_OUTPUT"

      - name: Verify tag on remote (workflow_dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ steps.tag.outputs.ref }}
        shell: bash
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${REF}" --silent \
            || { echo "::error::Tag '${REF}' does not exist on the remote. Push it first, then re-run."; exit 1; }

      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && steps.tag.outputs.ref || github.ref }}

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools-net10

      # The samples must replay to their committed casts; a stale outputs file would show a different recording.
      - name: Test replay
        run: dotnet test --project tests/Scenetake.Core.Tests -c Release --treenode-filter '/*/*/PlaygroundReplayTests/*'

      - name: Publish playground (browser-wasm Release)
        run: dotnet publish src/Scenetake.Playground/Scenetake.Playground.csproj -c Release -p:PlaygroundSoftFingerprint=true -o publish/

      # GitHub Pages drops folders that start with an underscore, such as _framework, unless Jekyll is off.
      - name: Add .nojekyll
        run: touch publish/wwwroot/.nojekyll

      - name: Deploy summary
        env:
          REF: ${{ github.event_name == 'workflow_dispatch' && steps.tag.outputs.ref || github.ref_name }}
        shell: bash
        run: |
          {
            echo "### Playground deploy"
            echo "- **Ref:** \`${REF}\`"
            echo "- **Commit:** \`$(git rev-parse HEAD)\`"
            echo "- **Samples:** $(ls publish/wwwroot/samples/*.outputs.json | wc -l)"
            echo "- **Size:** $(du -sh publish/wwwroot | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: publish/wwwroot

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
