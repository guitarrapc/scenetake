name: Build

concurrency:
  group: nativeaot-build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  npm-pack:
    name: Verify npm package
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Pack meta npm package
        shell: bash
        run: |
          set -euo pipefail
          cd npm/packages/scenetake
          npm pack
          test -f scenetake-*.tgz

      - name: Test wrapper package selection
        shell: bash
        run: bash npm/scripts/test-wrapper.sh

  build:
    name: Publish ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    # Allow SDK setup, pack, NativeAOT publish, and smoke tests on slower Intel macOS runners, and the package and SDK
    # installs in the Linux build containers.
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: ubuntu-24.04
            rid: linux-musl-x64
          - os: ubuntu-24.04-arm
            rid: linux-musl-arm64
          - os: windows-2025
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64
          - os: macos-26
            rid: osx-arm64
          - os: macos-26-intel
            rid: osx-x64
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # A musl leg publishes and tests in its container only: the runner's glibc cannot start a musl binary.
      - name: Set up .NET
        if: ${{ !startsWith(matrix.rid, 'linux-musl-') }}
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Pack global tool
        if: ${{ !startsWith(matrix.rid, 'linux-musl-') }}
        shell: bash
        run: |
          set -euo pipefail
          dotnet pack src/Scenetake/Scenetake.csproj -c Release -o ./nupkg
          test -f nupkg/scenetake.*.nupkg

      # Linked in a container at the release's C library floor (glibc 2.28, musl 1.2.3), which checks the floor and
      # runs smoke-binary.sh there.
      - name: Publish NativeAOT binary (Linux)
        if: ${{ startsWith(matrix.rid, 'linux-') }}
        shell: bash
        run: bash scripts/publish-linux.sh "${{ matrix.rid }}" "$GITHUB_WORKSPACE/artifacts/${{ matrix.rid }}"

      - name: Publish NativeAOT binary
        if: ${{ !startsWith(matrix.rid, 'linux-') }}
        shell: bash
        run: |
          artifact_dir="$GITHUB_WORKSPACE/artifacts/${{ matrix.rid }}"
          mkdir -p "$artifact_dir"
          dotnet publish src/Scenetake/Scenetake.csproj -c Release -r "${{ matrix.rid }}" --self-contained true -p:PublishAot=true -p:StripSymbols=true -p:DebugType=None -o "$artifact_dir"

      - name: Check platform floor (macOS)
        if: ${{ startsWith(matrix.rid, 'osx-') }}
        shell: bash
        run: bash scripts/check-binary-floor.sh "${{ matrix.rid }}" "$GITHUB_WORKSPACE/artifacts/${{ matrix.rid }}"

      - name: Install matrix CLI
        if: ${{ !startsWith(matrix.rid, 'linux-musl-') }}
        shell: bash
        run: |
          matrix_version="v1.0.2"
          matrix_dir="$RUNNER_TEMP/matrix"
          mkdir -p "$matrix_dir"
          case "${{ matrix.rid }}" in
            win-x64)
              curl -fsSL -o "$RUNNER_TEMP/matrix.zip" "https://github.com/guitarrapc/matrix/releases/download/${matrix_version}/matrix-win-amd64.zip"
              unzip -o "$RUNNER_TEMP/matrix.zip" -d "$matrix_dir"
              ;;
            win-arm64)
              curl -fsSL -o "$RUNNER_TEMP/matrix.zip" "https://github.com/guitarrapc/matrix/releases/download/${matrix_version}/matrix-win-arm64.zip"
              unzip -o "$RUNNER_TEMP/matrix.zip" -d "$matrix_dir"
              ;;
            linux-x64)
              curl -fsSL -o "$RUNNER_TEMP/matrix.tar.gz" "https://github.com/guitarrapc/matrix/releases/download/${matrix_version}/matrix-linux-amd64.tar.gz"
              tar -xzf "$RUNNER_TEMP/matrix.tar.gz" -C "$matrix_dir"
              ;;
            linux-arm64)
              curl -fsSL -o "$RUNNER_TEMP/matrix.tar.gz" "https://github.com/guitarrapc/matrix/releases/download/${matrix_version}/matrix-linux-arm64.tar.gz"
              tar -xzf "$RUNNER_TEMP/matrix.tar.gz" -C "$matrix_dir"
              ;;
            osx-x64)
              curl -fsSL -o "$RUNNER_TEMP/matrix.tar.gz" "https://github.com/guitarrapc/matrix/releases/download/${matrix_version}/matrix-osx-amd64.tar.gz"
              tar -xzf "$RUNNER_TEMP/matrix.tar.gz" -C "$matrix_dir"
              ;;
            osx-arm64)
              curl -fsSL -o "$RUNNER_TEMP/matrix.tar.gz" "https://github.com/guitarrapc/matrix/releases/download/${matrix_version}/matrix-osx-arm64.tar.gz"
              tar -xzf "$RUNNER_TEMP/matrix.tar.gz" -C "$matrix_dir"
              ;;
          esac
          echo "$matrix_dir" >> "$GITHUB_PATH"

      # On Linux this runs the binary linked at the glibc floor on the runner's newer glibc.
      - name: Smoke test published binary
        if: ${{ !startsWith(matrix.rid, 'linux-musl-') }}
        shell: bash
        run: |
          binary_name="scenetake"
          if [[ "${{ matrix.rid }}" == win-* ]]; then
            binary_name="scenetake.exe"
          fi
          bash scripts/smoke-binary.sh "$GITHUB_WORKSPACE/artifacts/${{ matrix.rid }}/$binary_name"

      # The zsh integration test in ShellStateTests skips when zsh is not on PATH.
      - name: Install zsh (Linux)
        if: ${{ startsWith(matrix.rid, 'linux-') && !startsWith(matrix.rid, 'linux-musl-') }}
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v zsh >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends zsh
          fi
          zsh --version

      - name: Test sources
        if: ${{ !startsWith(matrix.rid, 'linux-musl-') }}
        shell: bash
        run: |
          binary_name="scenetake"
          if [[ "${{ matrix.rid }}" == win-* ]]; then
            binary_name="scenetake.exe"
          fi
          # Every test outside the Smoke category, which smoke-binary.sh ran. With the published binary, the playground
          # replay also records a scenario, shell state runs in each OS's bash and pwsh (macOS has bash 3.2, whose dumps
          # differ), and each scenario of a batch is recorded by the binary started again, in the OS's default shell.
          export SCENETAKE_BIN="$GITHUB_WORKSPACE/artifacts/${{ matrix.rid }}/$binary_name"
          for project in tests/Scenetake.Core.Tests tests/Scenetake.Tests; do
            dotnet test --project "$project" -c Release --treenode-filter '/*/*/*/*[Category!=Smoke]'
          done

      - name: Upload macOS binary
        if: ${{ startsWith(matrix.rid, 'osx-') }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: scenetake-${{ matrix.rid }}
          path: |
            artifacts/${{ matrix.rid }}/scenetake
            artifacts/${{ matrix.rid }}/minipty_spawn_helper
          if-no-files-found: error
          retention-days: 1

  # The macOS binaries declare macOS 12.0, which check-binary-floor.sh checks. Hosted runners go back only to macOS 15,
  # so the binaries built on macOS 26 run there too.
  macos-oldest:
    name: Run ${{ matrix.rid }} on ${{ matrix.os }}
    needs: [build]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            rid: osx-arm64
            matrix-asset: matrix-osx-arm64
          - os: macos-15-intel
            rid: osx-x64
            matrix-asset: matrix-osx-amd64
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Download macOS binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: scenetake-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}

      - name: Install matrix CLI
        shell: bash
        run: |
          matrix_dir="$RUNNER_TEMP/matrix"
          mkdir -p "$matrix_dir"
          curl -fsSL -o "$RUNNER_TEMP/matrix.tar.gz" "https://github.com/guitarrapc/matrix/releases/download/v1.0.2/${{ matrix.matrix-asset }}.tar.gz"
          tar -xzf "$RUNNER_TEMP/matrix.tar.gz" -C "$matrix_dir"
          echo "$matrix_dir" >> "$GITHUB_PATH"

      - name: Smoke test binary built on macOS 26
        shell: bash
        run: |
          artifact_dir="$GITHUB_WORKSPACE/artifacts/${{ matrix.rid }}"
          # Artifacts do not keep file modes.
          chmod +x "$artifact_dir/scenetake" "$artifact_dir/minipty_spawn_helper"
          bash scripts/smoke-binary.sh "$artifact_dir/scenetake"

  mp4:
    name: Encode mp4 (linux-x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      # ffmpeg comes from a GitHub release, pinned by digest, and not from apt: on 2026-11-18 the Ubuntu mirror was so
      # slow that apt-get took over 9 minutes for ffmpeg's 87 packages, twice, and the job timed out. The release tag
      # b6.1.1 is the npm package's version. It holds John Van Sickle's static ffmpeg 7.0.2 with libx264.
      # The runner image has the DejaVu fonts, so apt runs only if a later image drops them.
      - name: Install ffmpeg and fonts
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg_dir="$RUNNER_TEMP/ffmpeg"
          mkdir -p "$ffmpeg_dir"
          cd "$ffmpeg_dir"
          base_url="https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1"
          curl -fsSL --retry 3 -o ffmpeg.gz "$base_url/ffmpeg-linux-x64.gz"
          curl -fsSL --retry 3 -o ffprobe.gz "$base_url/ffprobe-linux-x64.gz"
          printf '%s  %s\n' \
            bfe8a8fc511530457b528c48d77b5737527b504a3797a9bc4866aeca69c2dffa ffmpeg.gz \
            25d9b6ccb05e3d9de9e04e31e2506d8dd7f9f0418981965ac6df12e8d3afd067 ffprobe.gz | sha256sum -c -
          gunzip ffmpeg.gz ffprobe.gz
          chmod +x ffmpeg ffprobe
          echo "$ffmpeg_dir" >> "$GITHUB_PATH"
          ./ffmpeg -version
          if [[ ! -f /usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf ]]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends fonts-dejavu-core
          fi

      - name: Publish NativeAOT binary
        shell: bash
        run: |
          dotnet publish src/Scenetake/Scenetake.csproj -c Release -r linux-x64 --self-contained true -p:PublishAot=true -p:StripSymbols=true -p:DebugType=None -o "$RUNNER_TEMP/scenetake"

      - name: Encode mp4
        shell: bash
        run: |
          set -euo pipefail
          binary_path="$RUNNER_TEMP/scenetake/scenetake"
          "$binary_path" mp4 samples/pty.cast "$RUNNER_TEMP/pty.mp4"
          "$binary_path" mp4 --max-size 1280x1024 --fps 60 samples/interactive-pty.cast "$RUNNER_TEMP/interactive-pty.mp4"
          "$binary_path" --format mp4 samples/basic.yaml "$RUNNER_TEMP/basic"
          for file in pty.mp4 interactive-pty.mp4 basic.mp4; do
            ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,profile,pix_fmt,width,height,r_frame_rate -of compact "$RUNNER_TEMP/$file"
          done
          SCENETAKE_BIN="$binary_path" dotnet test --project tests/Scenetake.Tests -c Release --treenode-filter '/*/*/*/*[Category=Ffmpeg]'

  playground:
    name: Build playground (browser-wasm)
    runs-on: ubuntu-24.04
    # The playground builds the core library for WebAssembly. Building it here catches a change that only
    # breaks that build, which the tag-time deploy would otherwise find first. AOT runs only in the deploy.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools-net10

      - name: Build playground
        run: dotnet build src/Scenetake.Playground/Scenetake.Playground.csproj -c Release

  build-complete:
    needs: [npm-pack, build, macos-oldest, mp4, playground]
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Complete
        run: echo "Build complete"
