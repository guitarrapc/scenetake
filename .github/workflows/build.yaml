name: Build

concurrency:
  group: nativeaot-build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  npm-pack:
    name: Verify npm package
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Pack meta npm package
        shell: bash
        run: |
          set -euo pipefail
          cd npm/packages/scenetake
          npm pack
          test -f scenetake-*.tgz

  build:
    name: Publish ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: windows-2025
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64
          - os: macos-26
            rid: osx-arm64
          - os: macos-26-intel
            rid: osx-x64
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Pack global tool
        shell: bash
        run: |
          set -euo pipefail
          dotnet pack scenetake.cs -c Release -o ./nupkg
          test -f nupkg/scenetake.*.nupkg

      - name: Publish NativeAOT binary
        shell: bash
        run: |
          artifact_dir="$GITHUB_WORKSPACE/artifacts/${{ matrix.rid }}"
          mkdir -p "$artifact_dir"
          dotnet publish scenetake.cs -c Release -r "${{ matrix.rid }}" --self-contained true -p:PublishAot=true -p:StripSymbols=true -p:DebugType=None -o "$artifact_dir"

      - name: Install matrix CLI
        shell: bash
        run: |
          matrix_version="v1.0.2"
          matrix_dir="$RUNNER_TEMP/matrix"
          mkdir -p "$matrix_dir"
          case "${{ matrix.rid }}" in
            win-x64)
              curl -fsSL -o "$RUNNER_TEMP/matrix.zip" "https://github.com/guitarrapc/matrix/releases/download/${matrix_version}/matrix-win-amd64.zip"
              unzip -o "$RUNNER_TEMP/matrix.zip" -d "$matrix_dir"
              ;;
            win-arm64)
              curl -fsSL -o "$RUNNER_TEMP/matrix.zip" "https://github.com/guitarrapc/matrix/releases/download/${matrix_version}/matrix-win-arm64.zip"
              unzip -o "$RUNNER_TEMP/matrix.zip" -d "$matrix_dir"
              ;;
            linux-x64)
              curl -fsSL -o "$RUNNER_TEMP/matrix.tar.gz" "https://github.com/guitarrapc/matrix/releases/download/${matrix_version}/matrix-linux-amd64.tar.gz"
              tar -xzf "$RUNNER_TEMP/matrix.tar.gz" -C "$matrix_dir"
              ;;
            linux-arm64)
              curl -fsSL -o "$RUNNER_TEMP/matrix.tar.gz" "https://github.com/guitarrapc/matrix/releases/download/${matrix_version}/matrix-linux-arm64.tar.gz"
              tar -xzf "$RUNNER_TEMP/matrix.tar.gz" -C "$matrix_dir"
              ;;
            osx-x64)
              curl -fsSL -o "$RUNNER_TEMP/matrix.tar.gz" "https://github.com/guitarrapc/matrix/releases/download/${matrix_version}/matrix-osx-amd64.tar.gz"
              tar -xzf "$RUNNER_TEMP/matrix.tar.gz" -C "$matrix_dir"
              ;;
            osx-arm64)
              curl -fsSL -o "$RUNNER_TEMP/matrix.tar.gz" "https://github.com/guitarrapc/matrix/releases/download/${matrix_version}/matrix-osx-arm64.tar.gz"
              tar -xzf "$RUNNER_TEMP/matrix.tar.gz" -C "$matrix_dir"
              ;;
          esac
          echo "$matrix_dir" >> "$GITHUB_PATH"

      - name: Smoke test published binary
        shell: bash
        run: |
          artifact_dir="$GITHUB_WORKSPACE/artifacts/${{ matrix.rid }}"
          binary_name="scenetake"
          if [[ "${{ matrix.rid }}" == win-* ]]; then
            binary_name="scenetake.exe"
          fi

          binary_path="$artifact_dir/$binary_name"
          output_stem="$artifact_dir/smoke"

          test -f "$binary_path"

          "$binary_path" --format svg samples/basic.yaml "$output_stem"

          test -f "$output_stem.cast"
          test -f "$output_stem.svg"

          "$binary_path" svg "$output_stem.cast" "$artifact_dir/smoke-from-cast.svg"

          test -f "$artifact_dir/smoke-from-cast.svg"

          "$binary_path" svg samples/highlight.cast "$artifact_dir/highlight.svg"

          test -f "$artifact_dir/highlight.svg"

          for fixture in tests/fixtures/*.cast; do
            stem="$(basename "$fixture" .cast)"
            "$binary_path" svg "$fixture" "$artifact_dir/fixture-$stem.svg"
            test -f "$artifact_dir/fixture-$stem.svg"
          done

          dotnet run tests/terminal_tests.cs
          dotnet run tests/json_escape_test.cs
          dotnet run tests/pty_timing_test.cs
          dotnet run tests/pty_continue_test.cs
          dotnet run tests/cast_timing_test.cs
          SCENETAKE_BIN="$binary_path" dotnet run tests/stream_output_test.cs
          SCENETAKE_BIN="$binary_path" dotnet run tests/pty_test.cs
          dotnet run tests/interactive_pty_input_test.cs
          SCENETAKE_BIN="$binary_path" dotnet run tests/interactive_pty_test.cs
          dotnet run tests/readme_sync_test.cs
          dotnet run tests/svg_render_test.cs
          dotnet run tests/window_chrome_test.cs
          # Runner images ship no ffmpeg: real encodes skip here and run in the mp4 job.
          dotnet run tests/mp4_render_test.cs
          SCENETAKE_BIN="$binary_path" dotnet run tests/mp4_ffmpeg_test.cs

  mp4:
    name: Encode mp4 (linux-x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Install ffmpeg and fonts
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core

      - name: Publish NativeAOT binary
        shell: bash
        run: |
          dotnet publish scenetake.cs -c Release -r linux-x64 --self-contained true -p:PublishAot=true -p:StripSymbols=true -p:DebugType=None -o "$RUNNER_TEMP/scenetake"

      - name: Encode mp4
        shell: bash
        run: |
          set -euo pipefail
          binary_path="$RUNNER_TEMP/scenetake/scenetake"
          "$binary_path" mp4 samples/pty.cast "$RUNNER_TEMP/pty.mp4"
          "$binary_path" mp4 --max-size 1280x1024 --fps 60 samples/interactive-pty.cast "$RUNNER_TEMP/interactive-pty.mp4"
          "$binary_path" --format mp4 samples/basic.yaml "$RUNNER_TEMP/basic"
          for file in pty.mp4 interactive-pty.mp4 basic.mp4; do
            ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,profile,pix_fmt,width,height,r_frame_rate -of compact "$RUNNER_TEMP/$file"
          done
          dotnet run tests/mp4_render_test.cs
          SCENETAKE_BIN="$binary_path" dotnet run tests/mp4_ffmpeg_test.cs

  build-complete:
    needs: [npm-pack, build, mp4]
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Complete
        run: echo "Build complete"
