name: Build

concurrency:
  group: nativeaot-build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  npm-pack:
    name: Verify npm package
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Pack meta npm package
        shell: bash
        run: |
          set -euo pipefail
          cd npm/packages/scenetake
          npm pack
          test -f scenetake-*.tgz

      - name: Test wrapper package selection
        shell: bash
        run: bash npm/scripts/test-wrapper.sh

  build:
    name: Publish ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    # Allow SDK setup, pack, NativeAOT publish, and smoke tests on slower Intel macOS runners, and the package and SDK
    # installs in the Linux build containers.
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: ubuntu-24.04
            rid: linux-musl-x64
          - os: ubuntu-24.04-arm
            rid: linux-musl-arm64
          - os: windows-2025
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64
          - os: macos-26
            rid: osx-arm64
          - os: macos-26-intel
            rid: osx-x64
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # A musl leg publishes and tests in its container only: the runner's glibc cannot start a musl binary.
      - name: Set up .NET
        if: ${{ !startsWith(matrix.rid, 'linux-musl-') }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Pack global tool
        if: ${{ !startsWith(matrix.rid, 'linux-musl-') }}
        shell: bash
        run: |
          set -euo pipefail
          dotnet pack scenetake.cs -c Release -o ./nupkg
          test -f nupkg/scenetake.*.nupkg

      # Linked in a container at the release's C library floor (glibc 2.28, musl 1.2.3), which checks the floor and
      # runs smoke-binary.sh there.
      - name: Publish NativeAOT binary (Linux)
        if: ${{ startsWith(matrix.rid, 'linux-') }}
        shell: bash
        run: bash scripts/publish-linux.sh "${{ matrix.rid }}" "$GITHUB_WORKSPACE/artifacts/${{ matrix.rid }}"

      - name: Publish NativeAOT binary
        if: ${{ !startsWith(matrix.rid, 'linux-') }}
        shell: bash
        run: |
          artifact_dir="$GITHUB_WORKSPACE/artifacts/${{ matrix.rid }}"
          mkdir -p "$artifact_dir"
          dotnet publish scenetake.cs -c Release -r "${{ matrix.rid }}" --self-contained true -p:PublishAot=true -p:StripSymbols=true -p:DebugType=None -o "$artifact_dir"

      - name: Check platform floor (macOS)
        if: ${{ startsWith(matrix.rid, 'osx-') }}
        shell: bash
        run: bash scripts/check-binary-floor.sh "${{ matrix.rid }}" "$GITHUB_WORKSPACE/artifacts/${{ matrix.rid }}"

      - name: Install matrix CLI
        if: ${{ !startsWith(matrix.rid, 'linux-musl-') }}
        shell: bash
        run: |
          matrix_version="v1.0.2"
          matrix_dir="$RUNNER_TEMP/matrix"
          mkdir -p "$matrix_dir"
          case "${{ matrix.rid }}" in
            win-x64)
              curl -fsSL -o "$RUNNER_TEMP/matrix.zip" "https://github.com/guitarrapc/matrix/releases/download/${matrix_version}/matrix-win-amd64.zip"
              unzip -o "$RUNNER_TEMP/matrix.zip" -d "$matrix_dir"
              ;;
            win-arm64)
              curl -fsSL -o "$RUNNER_TEMP/matrix.zip" "https://github.com/guitarrapc/matrix/releases/download/${matrix_version}/matrix-win-arm64.zip"
              unzip -o "$RUNNER_TEMP/matrix.zip" -d "$matrix_dir"
              ;;
            linux-x64)
              curl -fsSL -o "$RUNNER_TEMP/matrix.tar.gz" "https://github.com/guitarrapc/matrix/releases/download/${matrix_version}/matrix-linux-amd64.tar.gz"
              tar -xzf "$RUNNER_TEMP/matrix.tar.gz" -C "$matrix_dir"
              ;;
            linux-arm64)
              curl -fsSL -o "$RUNNER_TEMP/matrix.tar.gz" "https://github.com/guitarrapc/matrix/releases/download/${matrix_version}/matrix-linux-arm64.tar.gz"
              tar -xzf "$RUNNER_TEMP/matrix.tar.gz" -C "$matrix_dir"
              ;;
            osx-x64)
              curl -fsSL -o "$RUNNER_TEMP/matrix.tar.gz" "https://github.com/guitarrapc/matrix/releases/download/${matrix_version}/matrix-osx-amd64.tar.gz"
              tar -xzf "$RUNNER_TEMP/matrix.tar.gz" -C "$matrix_dir"
              ;;
            osx-arm64)
              curl -fsSL -o "$RUNNER_TEMP/matrix.tar.gz" "https://github.com/guitarrapc/matrix/releases/download/${matrix_version}/matrix-osx-arm64.tar.gz"
              tar -xzf "$RUNNER_TEMP/matrix.tar.gz" -C "$matrix_dir"
              ;;
          esac
          echo "$matrix_dir" >> "$GITHUB_PATH"

      # On Linux this runs the binary linked at the glibc floor on the runner's newer glibc.
      - name: Smoke test published binary
        if: ${{ !startsWith(matrix.rid, 'linux-musl-') }}
        shell: bash
        run: |
          binary_name="scenetake"
          if [[ "${{ matrix.rid }}" == win-* ]]; then
            binary_name="scenetake.exe"
          fi
          bash scripts/smoke-binary.sh "$GITHUB_WORKSPACE/artifacts/${{ matrix.rid }}/$binary_name"

      - name: Test sources
        if: ${{ !startsWith(matrix.rid, 'linux-musl-') }}
        shell: bash
        run: |
          dotnet run tests/terminal_tests.cs
          dotnet run tests/json_escape_test.cs
          dotnet run tests/pty_timing_test.cs
          dotnet run tests/pty_continue_test.cs
          dotnet run tests/cast_timing_test.cs
          dotnet run tests/interactive_pty_input_test.cs
          dotnet run tests/readme_sync_test.cs
          dotnet run tests/svg_render_test.cs
          dotnet run tests/window_chrome_test.cs
          dotnet run tests/mp4_render_test.cs

      - name: Upload macOS binary
        if: ${{ startsWith(matrix.rid, 'osx-') }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: scenetake-${{ matrix.rid }}
          path: |
            artifacts/${{ matrix.rid }}/scenetake
            artifacts/${{ matrix.rid }}/minipty_spawn_helper
          if-no-files-found: error
          retention-days: 1

  # The macOS binaries declare macOS 12.0, which check-binary-floor.sh checks. Hosted runners go back only to macOS 15,
  # so the binaries built on macOS 26 run there too.
  macos-oldest:
    name: Run ${{ matrix.rid }} on ${{ matrix.os }}
    needs: [build]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            rid: osx-arm64
            matrix-asset: matrix-osx-arm64
          - os: macos-15-intel
            rid: osx-x64
            matrix-asset: matrix-osx-amd64
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Download macOS binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: scenetake-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}

      - name: Install matrix CLI
        shell: bash
        run: |
          matrix_dir="$RUNNER_TEMP/matrix"
          mkdir -p "$matrix_dir"
          curl -fsSL -o "$RUNNER_TEMP/matrix.tar.gz" "https://github.com/guitarrapc/matrix/releases/download/v1.0.2/${{ matrix.matrix-asset }}.tar.gz"
          tar -xzf "$RUNNER_TEMP/matrix.tar.gz" -C "$matrix_dir"
          echo "$matrix_dir" >> "$GITHUB_PATH"

      - name: Smoke test binary built on macOS 26
        shell: bash
        run: |
          artifact_dir="$GITHUB_WORKSPACE/artifacts/${{ matrix.rid }}"
          # Artifacts do not keep file modes.
          chmod +x "$artifact_dir/scenetake" "$artifact_dir/minipty_spawn_helper"
          bash scripts/smoke-binary.sh "$artifact_dir/scenetake"

  mp4:
    name: Encode mp4 (linux-x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Install ffmpeg and fonts
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core

      - name: Publish NativeAOT binary
        shell: bash
        run: |
          dotnet publish scenetake.cs -c Release -r linux-x64 --self-contained true -p:PublishAot=true -p:StripSymbols=true -p:DebugType=None -o "$RUNNER_TEMP/scenetake"

      - name: Encode mp4
        shell: bash
        run: |
          set -euo pipefail
          binary_path="$RUNNER_TEMP/scenetake/scenetake"
          "$binary_path" mp4 samples/pty.cast "$RUNNER_TEMP/pty.mp4"
          "$binary_path" mp4 --max-size 1280x1024 --fps 60 samples/interactive-pty.cast "$RUNNER_TEMP/interactive-pty.mp4"
          "$binary_path" --format mp4 samples/basic.yaml "$RUNNER_TEMP/basic"
          for file in pty.mp4 interactive-pty.mp4 basic.mp4; do
            ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,profile,pix_fmt,width,height,r_frame_rate -of compact "$RUNNER_TEMP/$file"
          done
          dotnet run tests/mp4_render_test.cs
          SCENETAKE_BIN="$binary_path" dotnet run tests/mp4_ffmpeg_test.cs
          SCENETAKE_BIN="$binary_path" dotnet run tests/scenario_render_test.cs

  build-complete:
    needs: [npm-pack, build, macos-oldest, mp4]
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Complete
        run: echo "Build complete"
