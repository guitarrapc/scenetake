name: Release

concurrency:
  group: nativeaot-release-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    tags:
      - "v*"

jobs:
  verify:
    name: Verify tag and version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Verify version ↔ tag consistency
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          TAG_VERSION="${TAG#v}"
          export TAG_VERSION

          PROPS_VERSION=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)

          if [ "$PROPS_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Directory.Build.props has '$PROPS_VERSION' but tag '$TAG' expects '$TAG_VERSION'"
            exit 1
          fi

          while IFS= read -r package_json; do
            PKG_VERSION=$(node -p "require('./$package_json').version")
            if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
              echo "::error::$package_json has '$PKG_VERSION' but tag '$TAG' expects '$TAG_VERSION'"
              exit 1
            fi
          done < <(find npm/packages -name package.json | sort)

          node <<'EOF'
          const version = process.env.TAG_VERSION;
          const pkg = require('./npm/packages/scenetake/package.json');
          for (const [name, depVersion] of Object.entries(pkg.optionalDependencies ?? {})) {
            if (depVersion !== version) {
              console.error(`::error::optionalDependencies['${name}'] is '${depVersion}', expected '${version}'`);
              process.exit(1);
            }
          }
          EOF

          echo "### Version check passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tag:** \`${TAG}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Directory.Build.props:** \`${PROPS_VERSION}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **npm packages:** \`${TAG_VERSION}\`" >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish ${{ matrix.os }}
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
            artifact: scenetake-linux-amd64
            ext: tar.gz
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            artifact: scenetake-linux-arm64
            ext: tar.gz
          - os: windows-2025
            rid: win-x64
            artifact: scenetake-win-amd64
            ext: zip
          - os: windows-11-arm
            rid: win-arm64
            artifact: scenetake-win-arm64
            ext: zip
          - os: macos-26
            rid: osx-arm64
            artifact: scenetake-osx-arm64
            ext: tar.gz
          - os: macos-26-intel
            rid: osx-x64
            artifact: scenetake-osx-amd64
            ext: tar.gz
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: 10.0.x

      - name: Publish NativeAOT binary
        shell: bash
        run: |
          artifact_dir="$GITHUB_WORKSPACE/release/${{ matrix.rid }}"
          mkdir -p "$artifact_dir"
          dotnet publish scenetake.cs -c Release -r "${{ matrix.rid }}" --self-contained true -p:PublishAot=true -p:StripSymbols=true -p:DebugType=None -o "$artifact_dir"

      - name: Smoke test published binary
        shell: bash
        run: |
          artifact_dir="$GITHUB_WORKSPACE/release/${{ matrix.rid }}"
          binary_name="scenetake"
          if [[ "${{ matrix.rid }}" == win-* ]]; then
            binary_name="scenetake.exe"
          fi

          binary_path="$artifact_dir/$binary_name"
          output_path="$artifact_dir/smoke.cast"

          test -f "$binary_path"

          if [[ "${{ matrix.rid }}" == linux-* ]]; then
            test ! -f "$artifact_dir/libminipty_unix.so"
          fi

          if [[ "${{ matrix.rid }}" == osx-* ]]; then
            test ! -f "$artifact_dir/libminipty_unix.dylib"
            test -f "$artifact_dir/minipty_spawn_helper"
          fi

          "$binary_path" samples/basic.yaml "$output_path"

          test -f "$output_path"

      - name: Package release assets (Linux/macOS)
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: |
          artifact_dir="$GITHUB_WORKSPACE/release/${{ matrix.rid }}"
          archive_path="$GITHUB_WORKSPACE/${{ matrix.artifact }}.tar.gz"
          checksum_path="$archive_path.sha256"

          if [[ "${{ matrix.rid }}" == linux-* ]]; then
            tar -czf "$archive_path" -C "$artifact_dir" scenetake
          elif [[ "${{ matrix.rid }}" == osx-* ]]; then
            tar -czf "$archive_path" -C "$artifact_dir" scenetake minipty_spawn_helper
          else
            tar -czf "$archive_path" -C "$artifact_dir" .
          fi

          if command -v sha256sum >/dev/null 2>&1; then
            checksum_value=$(sha256sum "$archive_path" | awk '{print $1}')
          else
            checksum_value=$(shasum -a 256 "$archive_path" | awk '{print $1}')
          fi

          printf '%s  %s\n' "$checksum_value" "$(basename "$archive_path")" > "$checksum_path"

          test -f "$archive_path"
          test -f "$checksum_path"

      - name: Package release assets (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $artifactDir = "$env:GITHUB_WORKSPACE\release\${{ matrix.rid }}"
          $archivePath = "$env:GITHUB_WORKSPACE\${{ matrix.artifact }}.zip"
          $checksumPath = "$archivePath.sha256"

          Compress-Archive -Path "$artifactDir\scenetake.exe" -DestinationPath $archivePath

          $hash = (Get-FileHash $archivePath -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.artifact }}.zip" | Set-Content $checksumPath -NoNewline

          if (-not (Test-Path $archivePath)) { exit 1 }
          if (-not (Test-Path $checksumPath)) { exit 1 }

      - name: Upload build artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ github.workspace }}/${{ matrix.artifact }}.${{ matrix.ext }}
            ${{ github.workspace }}/${{ matrix.artifact }}.${{ matrix.ext }}.sha256
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts/ -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.sha256' \) -exec cp {} release/ \;

          echo "### Release assets" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          find release/ -maxdepth 1 -type f | sort | xargs -n 1 basename >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: |
            release/*.tar.gz
            release/*.zip

      - name: Create GitHub Release
        shell: bash
        run: |
          gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag --draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}

  npm-stage:
    name: Stage npm packages
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts/ -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} release/ \;

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm
        run: npm install -g npm@11

      - name: Assemble and stage npm packages
        shell: bash
        run: |
          set -euo pipefail
          packages_dir="$(bash npm/scripts/assemble-packages.sh "$GITHUB_WORKSPACE/release")"
          bash npm/scripts/stage-all.sh "$packages_dir" | tee "$RUNNER_TEMP/staged.log"
          echo "### npm staged" >> "$GITHUB_STEP_SUMMARY"
          echo 'Approve locally with 2FA to publish:' >> "$GITHUB_STEP_SUMMARY"
          echo '```sh' >> "$GITHUB_STEP_SUMMARY"
          echo "npm stage list" >> "$GITHUB_STEP_SUMMARY"
          echo "npm stage approve <stage-id>" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  nuget-publish:
    name: Publish NuGet tool package
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: 10.0.x

      - name: Pack global tool
        shell: bash
        run: |
          set -euo pipefail
          dotnet pack scenetake.cs -c Release -o ./nupkg
          test -f nupkg/scenetake.*.nupkg

      - name: NuGet login (OIDC)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: login
        with:
          user: ${{ secrets.SYNCED_NUGET_USER }}

      - name: Push to NuGet.org
        shell: bash
        run: |
          set -euo pipefail
          dotnet nuget push ./nupkg/*.nupkg --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          echo "### NuGet published" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Package:** \`scenetake\`" >> "$GITHUB_STEP_SUMMARY"
